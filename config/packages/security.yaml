security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        main:
            pattern: ^/
            form_login:
                login_path: app_login        # La route de la page de connexion
                check_path: app_login        # Le chemin où envoyer le formulaire de login
                default_target_path: /dashboard # Redirection après connexion réussie
            logout:
                path: /logout
                target: /login

    access_control:
        - { path: ^/dashboard }
